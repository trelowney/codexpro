---
configuration:
  auto_launch_codex:
    name: Spustit Codex rovnou
    description: >-
      Zapnuto: po otevření panelu jsi hned v Codexu. Vypnuto: nejdřív se ukáže
      nabídka (nová session, navázat na poslední, přihlášení, aktualizace,
      obyčejný shell). Do nabídky se vždycky dostaneš přes Ctrl-C.
  model:
    name: Model
    description: >-
      Nech prázdné a použije se výchozí model Codexu. Název (třeba gpt-5.4)
      vyplň jen když víš, že chceš konkrétní model - špatný název způsobí, že
      Codex odmítne odpovídat.
  approval_policy:
    name: Kdy se má Codex ptát na svolení
    description: >-
      on-request = zeptá se před riskantním krokem (doporučeno).
      untrusted = ptá se na všechno, co nepovažuje za bezpečné.
      on-failure = zeptá se až když příkaz selže.
      never = neptá se nikdy a dělá všechno sám. "never" volej jen když máš
      zálohy a víš, co děláš.
  file_access:
    name: Co smí Codex dělat se soubory a příkazy
    description: >-
      full = Codex může spouštět příkazy a měnit soubory všude, kam doplněk
      vidí (doporučeno; doplněk stejně vidí jen konfiguraci Home Assistantu,
      konfigurace ostatních doplňků, share, media a addons).
      workspace = vlastní izolace Codexu navíc; kontejner doplňku v Home
      Assistantu ji nedovolí, takže doplněk přepne na full a napíše to do logu.
  enable_ha_mcp:
    name: Nechat Codex mluvit přímo s Home Assistantem
    description: >-
      Zapnuto: Codex si umí vypsat entity a volat služby, nejen číst YAML.
      Vypnuto: pracuje jen se soubory. Vypni, když se v logu doplňku objevují
      chyby s "MCP".
  openai_api_key:
    name: OpenAI API klíč (nepovinné)
    description: >-
      Potřebuješ jen když chceš platit podle spotřeby přes API klíč. Když máš
      ChatGPT Plus, Pro nebo Business, nech prázdné a přihlas se z terminálu
      (volba 4 v nabídce).
  auto_update_codex:
    name: Aktualizovat Codex při každém startu
    description: >-
      Zapnuto: doplněk si při každém startu stáhne nejnovější Codex CLI - start
      je pomalejší a potřebuje internet. Vypnuto: použije se verze z doplňku a
      aktualizuješ ručně příkazem "codex-update".
  auto_update_ha_mcp:
    name: Aktualizovat propojení s Home Assistantem při každém startu
    description: >-
      Ta část, díky které Codex umí číst entity, volat služby a upravovat
      dashboardy (hass-mcp), pravidelně dostává nové schopnosti. Zapnuto: při
      každém startu se stáhne nejnovější verze - start je pomalejší a potřebuje
      internet. Vypnuto: použije se verze z doplňku a aktualizuješ ručně
      příkazem "mcp-update".
  tmux_mouse:
    name: Myš v terminálu
    description: >-
      Zapnuto: v terminálu funguje rolování a klikání myší, ale rozbije se
      běžné kopírování v prohlížeči. Vypnuto (doporučeno): normální kopírování.
  persistent_apk_packages:
    name: Programy, které mají zůstat nainstalované
    description: >-
      Názvy balíčků Alpine Linuxu, každý na řádek (třeba htop, rsync).
      Nainstalují se automaticky po každém restartu i aktualizaci. Názvy najdeš
      na pkgs.alpinelinux.org.
  persistent_pip_packages:
    name: Python balíčky, které mají zůstat nainstalované
    description: >-
      Názvy Python balíčků, každý na řádek (třeba requests, pandas).
      Nainstalují se automaticky po každém restartu i aktualizaci.
  voice_stt_provider:
    name: Převod řeči na text pro diktování
    description: >-
      Nepovinné. Tlačítko 🎤 Voice Input pak použije převod řeči na text
      z Home Assistantu místo prohlížeče (nutné ve Firefoxu a v aplikaci Home
      Assistant). Vyplňte entitu převodu, třeba stt.faster_whisper nebo
      stt.home_assistant_cloud - které máte, ukáže Nastavení > Hlasoví
      asistenti. Prázdné = rozpoznávání řeči v prohlížeči. Po změně
      restartujte doplněk.
  voice_language:
    name: Jazyk diktování
    description: >-
      Jazyk, kterým budete mluvit, třeba cs, en nebo de-DE. Prázdné = jazyk
      prohlížeče. Dá se změnit i přímo v okně diktování před nahráváním.
network:
  7680/tcp: >-
    Webové rozhraní bez postranní lišty. Netřeba - panel funguje i bez něj.
    BEZ PŘIHLÁŠENÍ: kdokoli, kdo se na tento port dostane, má root shell.
    Nech prázdné, pokud síti úplně nevěříš.
  7681/tcp: >-
    Samotný terminál bez postranní lišty. Netřeba - panel funguje i bez něj.
    BEZ PŘIHLÁŠENÍ: kdokoli, kdo se na tento port dostane, má root shell.
    Nech prázdné, pokud síti úplně nevěříš.
