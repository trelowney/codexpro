---
configuration:
  auto_launch_codex:
    name: Start Codex automatically
    description: >-
      On: opening the panel drops you straight into Codex. Off: you get a menu
      first (new session, continue last session, sign in, update, plain shell).
      You can always get to the menu with Ctrl-C.
  model:
    name: Model
    description: >-
      Leave empty to use whatever Codex picks by default. Fill in a model name
      (for example gpt-5.4) only if you know you want that specific one. A wrong
      name makes Codex refuse to start a conversation.
  approval_policy:
    name: When should Codex ask before doing something
    description: >-
      on-request = Codex asks before risky steps (recommended).
      untrusted = no longer offered by Codex; works like on-request.
      on-failure = only asks after a command failed.
      never = never asks, does everything on its own. Use "never" only if you
      have backups and you know what you are doing.
  file_access:
    name: Which files Codex may change
    description: >-
      full = Codex can run commands and change files everywhere the add-on
      can see (recommended; the add-on only sees your Home Assistant
      configuration, other add-on configs, share, media and add-ons anyway).
      workspace = Codex's own extra sandbox; Home Assistant's add-on container
      does not allow it, so the add-on falls back to full and says so in the
      log.
  enable_ha_mcp:
    name: Let Codex talk to Home Assistant directly
    description: >-
      On: Codex can look up your entities and call services, not just read YAML
      files. Off: Codex only works with files. Turn it off if the add-on log
      shows errors mentioning MCP.
  openai_api_key:
    name: OpenAI API key (optional)
    description: >-
      Only needed if you want to pay per use with an API key instead of signing
      in with a ChatGPT account. Leave empty and sign in from the terminal
      (option 4 in the menu) if you have ChatGPT Plus, Pro or Business.
  auto_update_codex:
    name: Update Codex on every start
    description: >-
      On: the add-on fetches the newest Codex CLI each time it starts, which
      makes starting slower and needs internet. Off: use the version that came
      with the add-on and update by hand with the "codex-update" command.
  auto_update_ha_mcp:
    name: Update the Home Assistant connection on every start
    description: >-
      The part that lets Codex read entities, call services and edit UI
      dashboards (hass-mcp) gains new abilities regularly. On: the newest
      version is fetched at every start, which makes starting slower and needs
      internet. Off: use the version that came with the add-on and update by
      hand with the "mcp-update" command.
  tmux_mouse:
    name: Mouse support in the terminal
    description: >-
      On: you can scroll and click in the terminal with the mouse, but browser
      copy and paste stops working the usual way. Off (recommended): normal
      copy and paste.
  persistent_apk_packages:
    name: Extra programs to keep installed
    description: >-
      Alpine Linux package names, one per line (for example htop, rsync). They
      are reinstalled automatically after every restart and update. Find names
      at pkgs.alpinelinux.org.
  persistent_pip_packages:
    name: Extra Python packages to keep installed
    description: >-
      Python package names, one per line (for example requests, pandas). They
      are reinstalled automatically after every restart and update.
  voice_stt_provider:
    name: Speech-to-text engine for voice input
    description: >-
      Optional. Lets the 🎤 Voice Input button use your Home Assistant
      speech-to-text engine instead of the browser's (needed in Firefox and
      in the Home Assistant app). Fill in the engine's entity ID, for example
      stt.faster_whisper or stt.home_assistant_cloud - Settings > Voice
      assistants shows which engines you have. Leave empty to use the
      browser's own speech recognition. Restart the add-on after changing it.
  voice_language:
    name: Voice input language
    description: >-
      Language you will speak, for example cs, en or de-DE. Leave empty to use
      the browser's language. It can also be changed in the voice window
      before recording.
  status_line:
    name: Usage and home on the status bar
    description: >-
      The bar under the terminal shows how much of Codex's 5-hour and weekly
      limits is left and when each resets (⏱ 5h 62% left ↻14:30 · 7d 80% left),
      then 🏠 ✓ when all is well at home, otherwise what needs a look: safety
      alarms, repairs, automations that did not load, an old backup, a full
      disk, a new Home Assistant version, updates, low batteries. Leave empty
      for all of that. Write off to hide it. Or list only what you want, in
      order (limits, alerts, repairs, automations, backup, disk, core, updates,
      unavailable, battery) and add any entity, for example
      CO2=sensor.living_room_co2. A minus leaves entities out, for example
      -switch.coffee_machine or -sensor.car_*. Type ha-status in the terminal
      for the explanation.
network:
  7680/tcp: >-
    Web interface without the sidebar. Not needed - the panel works without it.
    NO LOGIN: anyone who can reach this port gets a root shell. Leave empty
    unless the network is fully trusted.
  7681/tcp: >-
    Bare terminal without the sidebar. Not needed - the panel works without it.
    NO LOGIN: anyone who can reach this port gets a root shell. Leave empty
    unless the network is fully trusted.
