name: Build and publish Codex Pro

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "codexpro/**"
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: codexpro

permissions:
  contents: read

jobs:
  init:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' codexpro/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "::error::Unable to read version from codexpro/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Add-on version: ${version}"

      # Every option and port needs a label and help text in every language,
      # or the Configuration tab shows raw keys nobody understands.
      - name: Check option labels and help text
        shell: bash
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet --break-system-packages pyyaml
          python3 scripts/check-addon-metadata.py

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build machine
        shell: bash
        run: |
          cpu="$(lscpu | sed -nE 's/^Model name:[[:space:]]+//p' | head -n1)"
          {
            echo "### Build machine (${{ matrix.arch }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | ${RUNNER_NAME} (${RUNNER_ENVIRONMENT:-unknown}) |"
            echo "| Runner image | ${ImageOS:-?} ${ImageVersion:-?} |"
            echo "| System | $(. /etc/os-release && echo "${PRETTY_NAME}"), kernel $(uname -r) |"
            echo "| CPU | ${cpu:-unknown} ($(uname -m), $(nproc) cores) |"
            echo "| RAM | $(free -h | awk '/^Mem:/ {print $2}') |"
            echo "| Free disk | $(df -h --output=avail / | tail -n1 | tr -d ' ') |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          # The base image and the labels live in the Dockerfile; the builder
          # adds BUILD_ARCH, BUILD_VERSION and the io.hass.* labels itself
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: codexpro
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          labels: |
            io.hass.type=addon
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - init
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

  verify:
    name: Check the published image
    needs:
      - init
      - manifest
    runs-on: ubuntu-latest
    steps:
      - name: Version, labels and architecture of every image
        shell: bash
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          fail=0
          for tag in "${VERSION}" latest; do
            json="$(docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${tag}" --format '{{json .Image}}')"
            for platform in linux/amd64 linux/arm64; do
              got() { jq -r --arg p "${platform}" --arg k "$1" '.[$p].config.Labels[$k] // ""' <<< "${json}"; }
              arch="$(jq -r --arg p "${platform}" '.[$p].architecture // ""' <<< "${json}")"
              line="${tag} ${platform}: arch=${arch} io.hass.version=$(got io.hass.version) oci.version=$(got org.opencontainers.image.version) source=$(got org.opencontainers.image.source)"
              echo "${line}" | tee -a "${GITHUB_STEP_SUMMARY}"
              [[ "${arch}" == "${platform#linux/}" ]] || { echo "::error::${tag} ${platform}: wrong architecture '${arch}'"; fail=1; }
              [[ "$(got io.hass.version)" == "${VERSION}" ]] || { echo "::error::${tag} ${platform}: io.hass.version is not ${VERSION}"; fail=1; }
              [[ "$(got org.opencontainers.image.version)" == "${VERSION}" ]] || { echo "::error::${tag} ${platform}: org.opencontainers.image.version is not ${VERSION}"; fail=1; }
              [[ "$(got org.opencontainers.image.source)" == "https://github.com/${{ github.repository }}" ]] || { echo "::error::${tag} ${platform}: wrong image source"; fail=1; }
            done
          done
          exit "${fail}"
